<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <!-- LOGIN CONTAINER -->
        <div id="loginContainer">
            <h1>Sign in</h1>
            <p>Don’t have an account? <span id="showRegister">Create New</span></p>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" placeholder="example@gmail.com" required>

                <label>Password</label>
                <div class="password-box">
                    <input type="password" id="loginPassword" placeholder="••••••" required>
                    <span id="togglePassword">👁</span>
                </div>

                <div class="options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Sign in</button>
            </form>
        </div>

        <!-- REGISTER CONTAINER -->
        <div id="registerContainer" class="hidden">
            <h1>Create New</h1>
            <p>Already have an account? <span id="showLogin">Sign In</span></p>

            <form id="registerForm">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>District</label>
                <input type="text" placeholder="Enter your district" required>

                <label>City</label>
                <input type="text" placeholder="Enter your city" required>

                <label>Address</label>
                <input type="text" placeholder="Enter your address" required>

                <label>Mobile No</label>
                <input type="text" placeholder="Enter your mobile number" required>

                <label>Upload Citizenship</label>
                <input type="file" required>

                <label>Email</label>
                <input type="email" placeholder="example@gmail.com" required>

                <label>Password</label>
                <input type="password" placeholder="••••••" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="••••••" required>

                <label>Register As</label>
                <div class="role-select">
                    <button type="button" class="active" data-role="user">User</button>
                    <button type="button" data-role="landlord">Landlord</button>
                </div>

                <button type="submit">Register</button>
            </form>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="overlay"></div>
        <div class="right-content">
            <h1 class="brand-title">Nepal Rental Sewa</h1>
            <p class="tagline">Your trusted partner in property rentals.</p>

            <!-- Real Estate Illustration -->
            <img src="room.jpg" alt="Real Estate Illustration" class="hero-img">

            <!-- Quote -->
            <blockquote class="quote">
                “Invest in property today, secure your future tomorrow.”
            </blockquote>

            <!-- Call to Action -->
            <button class="cta">Explore Properties</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
